[platformio]
default_envs = nodemcuv2-rf-cc1101-custom

[env:nodemcuv2-rf-cc1101-custom]
extends = env:nodemcuv2-rf-cc1101

build_flags =
    ${env:nodemcuv2-rf-cc1101.build_flags}
    -D RF_RECEIVER_GPIO=4
    -D RF_EMITTER_GPIO=5
    -D RF_CC1101_SCK=14
    -D RF_CC1101_MISO=12
    -D RF_CC1101_MOSI=13
    -D RF_CC1101_CS=16
